name: Retail POS and Store Operations Workflow
document_type: POS Order
is_active: true
workflow_state_field: status

states:
  - state: open
    doc_status: 0
    allow_edit: Retail POS and Store Operations Operator, Retail POS and Store Operations Administrator
    style: default
  - state: authorized
    doc_status: 0
    allow_edit: Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
    style: info
  - state: fulfilled
    doc_status: 0
    allow_edit: Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
    style: info
  - state: paid
    doc_status: 0
    allow_edit: Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
    style: info
  - state: closed
    doc_status: 1
    allow_edit: Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
    style: success

transitions:
  - action: Advance
    from: open
    to: authorized
    allowed: Retail POS and Store Operations Operator, Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
  - action: Advance
    from: authorized
    to: fulfilled
    allowed: Retail POS and Store Operations Operator, Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
  - action: Advance
    from: fulfilled
    to: paid
    allowed: Retail POS and Store Operations Operator, Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
  - action: Advance
    from: paid
    to: closed
    allowed: Retail POS and Store Operations Operator, Retail POS and Store Operations Reviewer, Retail POS and Store Operations Administrator
