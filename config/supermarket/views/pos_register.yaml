name: Supermarket POS
route: /pos
type: register
layout: two_panel
label: Supermarket POS
module: Sales
components:
  - id: scanner
    type: scanner_input
    region: main
    position: 0
    bindings:
      search_fields: "barcode, sku, product_name"
  - id: categories
    type: category_tabs
    region: main
    position: 1
    source_doctype: Product
    bindings:
      group_field: category
  - id: products
    type: product_grid
    region: main
    position: 2
    source_doctype: Product
    label: Products
    bindings:
      title: product_name
      subtitle: category
      price: selling_price
      badge: stock_qty
    mobile_columns: [product_name, selling_price]
    filters:
      - field: is_active
        op: equals
        value: true
    actions:
      - id: tap
        trigger: on_click
        type: local_cart_add
  - id: cart
    type: cart_panel
    region: side
    position: 0
  - id: payments
    type: payment_panel
    region: side
    position: 1
    bindings:
      methods: "cash, card, mobile_money, mpesa"
    actions:
      - id: complete
        trigger: on_click
        type: create_transaction
        config:
          target_doctype: Sale
          child_table: Sale Item
          line_source: cart
                movement_date: parent.creation
